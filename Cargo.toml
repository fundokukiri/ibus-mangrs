[package]
name = "ibus-mangrs"
version = "1.2.8"
edition = "2021"
authors = ["fundoku"]
description = "MăngRS - Vietnamese IBus engine built on bamboo-core (make by fundoku with agents coding)"
license = "GPL-3.0"

[lib]
name = "ibus_mangrs"
path = "src/lib.rs"

[[bin]]
name = "ibus-engine-mangrs"
path = "src/main.rs"

[dependencies]
# 0.5.5 keeps a completed syllable when a mark key is refused (the wrapper's
# kept-composition guard now only covers the raw-revert shape) and accepts
# f/j/w as onset consonants (the auto-restore refuses those words, which are
# never Vietnamese syllables).
bamboo-core = "0.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dbus = "0.9.12"
dirs = "6"
libc = "0.2"
# The prediction model is a read-only mmap: page-cached binary searches,
# no RAM copy at startup (a pread fallback stays possible without this).
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
# XTest injection: compiled unconditionally so it must build on Wayland-only
# machines too; it is only selected where an X server answers.
x11rb = { version = "0.13", features = ["xtest"] }
# Wayland injection: compiled unconditionally so it must build on X11-only
# machines too; it is only selected where a compositor exposes the
# virtual-keyboard global.
wayland-client = "0.31"
# virtual-keyboard's bindings live in the -misc split of wayland-protocols
# (the protocol is homeless upstream; neither wayland-protocols 0.32 nor -wlr
# nor -plasma ship it).
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[features]
default = []
gui = ["dep:gtk4", "dep:libadwaita"]

[dependencies.gtk4]
version = "0.9"
optional = true
# v4_6: gdk Texture::from_bytes for the embedded logo on the About page.
# v4_8: glib::Propagation for the modern hotkey-capture button.
# v4_10: gtk::FileDialog for the JSON import/export pickers.
features = ["v4_6", "v4_8", "v4_10"]

[dependencies.libadwaita]
version = "0.7"
optional = true
# v1_5: NavigationSplitView + AdwDialog family for the GNOME Settings look.
features = ["v1_5"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Fast preview profile for iterating on the GUI: release optimizations
# without LTO/CGU=1, which dominate the 24 s link time.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# Lean dev verification: line-tables debuginfo keeps the ~20 test-binary
# links fast and the target dir small. A debugging session that needs
# variable inspection overrides per invocation:
# cargo test --config 'profile.dev.debug=true'
[profile.dev]
debug = 1
