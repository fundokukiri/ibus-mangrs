[package]
name = "ibus-mangrs"
version = "1.1.8"
edition = "2021"
authors = ["fundoku"]
description = "MăngRS - Vietnamese IBus engine built on bamboo-core (make by fundoku with agents coding)"
license = "GPL-3.0"

[lib]
name = "ibus_mangrs"
path = "src/lib.rs"

[[bin]]
name = "ibus-engine-mangrs"
path = "src/main.rs"

[dependencies]
# 0.5.4 (tag 99a02d9) carries the 08/11 hot-path perf merge plus the
# FFI-safety audit branch; the wrapper guards it actually needs stay.
bamboo-core = "0.5.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dbus = "0.9.12"
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"

[features]
default = []
gui = ["dep:gtk4", "dep:libadwaita"]

[dependencies.gtk4]
version = "0.9"
optional = true
# v4_6: gdk Texture::from_bytes for the embedded logo on the About page.
# v4_8: glib::Propagation for the hotkey-capture button in the classic GUI.
# v4_10: gtk::FileDialog for the JSON import/export pickers.
features = ["v4_6", "v4_8", "v4_10"]

[dependencies.libadwaita]
version = "0.7"
optional = true
# v1_5: NavigationSplitView + AdwDialog family for the GNOME Settings look.
features = ["v1_5"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# Fast preview profile for iterating on the GUI: release optimizations
# without LTO/CGU=1, which dominate the 24 s link time.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
