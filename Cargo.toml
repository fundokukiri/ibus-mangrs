[package]
name = "ibus-mangrs"
version = "0.1.1"
edition = "2021"
authors = ["fundoku"]
description = "MăngRS - Vietnamese IBus engine built on bamboo-core (make by fundoku with agents coding)"
license = "MIT"

[lib]
name = "ibus_mangrs"
path = "src/lib.rs"

[[bin]]
name = "ibus-engine-ibus-mangrs"
path = "src/main.rs"

[dependencies]
# bamboo-core is a git submodule pinned to the v0.5.3 tag
# (git submodule update --init after a fresh clone).
bamboo-core = { path = "bamboo-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dbus = "0.9.12"
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"

[features]
default = []
gui = ["dep:gtk4"]

[dependencies.gtk4]
version = "0.9"
optional = true
# v4_6: gdk Texture::from_bytes for the embedded logo on the About page.
# v4_8: CheckButton::set_child for the pill navigation in the header bar.
features = ["v4_6", "v4_8"]

[profile.release]
lto = true
codegen-units = 1
strip = true
