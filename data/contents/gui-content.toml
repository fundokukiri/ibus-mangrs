[tips]
enabled = "Bật/tắt cả bộ gõ. Khi tắt, mọi phím đi thẳng vào app như chưa cài MăngRS."
method = "Kiểu gõ quyết định cách chữ dấu được tạo từ chuỗi phím: Telex (ss → á), VNI (a1 → á) hoặc VIQR."
mode = "Gạch chân (preedit): chữ gạch chân inline, commit khi hết từ — cần client hỗ trợ preedit, không hỗ trợ thì tự chuyển Surrounding. Surrounding text: mỗi phím commit ngay, đuôi từ được sửa lại qua xóa-văn-bản — cần client báo surrounding-text; client không báo thì đuôi từ được xóa bằng phím chèn (backend) hoặc phím chuyển tiếp thay thế. Flow: phím raw được chuyển thẳng, dấu hiện ngay từng bước, hết từ commit — cần backend chèn phím (uinput/Wayland), không có thì tự chạy như Forward Backspace. Forward Backspace: mỗi phím commit ngay, sửa đuôi bằng phím Backspace chuyển tiếp qua IBus — không bao giờ tự chuyển mode, chạy được ở mọi client kể cả terminal/XIM. OFF: tắt xử lý tiếng Việt, macro vẫn chạy."
mode_visibility = "Bỏ chọn một chế độ để ẩn nó khỏi menu, phím tắt, luật theo app và bộ chọn chế độ. Chế độ đang dùng sẽ chuyển sang mục còn hiện đầu tiên."
charset = "Bảng mã chữ: Unicode cho mọi dùng đợp thường, các bảng VNI/TCVN3 chỉ cần khi đọc file văn bản cũ."
hide_underline = "Ẩn gạch chân preedit cho những app vẽ gạch chân lỗi (một số game, terminal)."
modern = "Chuẩn đặt dấu mới của Bộ GD-ĐT: hòa thay vì hoà, thuế thay vì thuể."
free = "Cho phép dấu đứng tự do trong từ thay vì luôn ở nguyên âm gần nhất."
auto_correct = "Âm tiết không có trong từ điển tiếng Việt sẽ trả về đúng chuỗi phím đã bấm."
auto_restore = "Từ nước ngoài (english, hello) gõ xong tự trả về chuỗi phím gốc thay vì giữ nguyên."
extended_finals = "Cho phép g, k, h, nk đứng thay cho âm cuối ng, c, nh nên dấu thanh đúng dù gõ trước hay sau âm cuối (nhuwgx → nhữg). Từ tiếng Anh có thể đổi (book → bôk); mặc định tắt."
extended_onsets = "Cho phép f, j, w đứng làm âm đầu và nhận dấu thanh (fos → fó). Mặc định tắt: không từ tiếng Việt nào bắt đầu bằng các chữ này, tắt giúp từ tiếng Anh (fire, water) không bị ghi dấu oan."
keep_composed_words = "Sau một từ hoàn chỉnh, phím chữ mà từ không nhận được sẽ nối vào từ thay vì đập cả từ về chuỗi phím gốc (tùng + g → tùngg). Đổi giá khi bật: từ tiếng Anh dạng soft sẽ ở lại sòt, vì từ được giữ miễn khôi phục cuối từ. Mặc định tắt."
keep_repeats_raw = "Dành riêng cho chế độ Flow: giữ một phím ở Flow chỉ lặp được một lần rồi dừng ở ô (oo → ô rồi đứng im), bật thì phím giữ chảy nguyên bản oooo… như bàn phím thường. Các chế độ gõ khác không gặp lỗi này nên không cần bật. Đổi giá khi bật: hai phím giống nhau gõ cách nhau quá ~0,4 giây sẽ ở lại nguyên bản (tooi thay vì tôi). Mặc định tắt."
suggest_words = "Từ đang gõ hiện trong ô nổi cạnh con trỏ kèm dải gợi ý bên dưới; ô soạn giữ sạch đến khi từ được commit (mặc định Ô nổi). Danh sách lấy từ mô hình dự đoán (từ điển đã rời dải gợi ý — sau này nó làm kiểm tra chính tả): gõ chữ cái đầu tiên là gợi ý đã chạy, từ ghép hai tiếng dẫn đầu khi âm tiết hoàn chỉnh ('sinh' thấy 'sinh viên'), từ đơn theo sau; sau khi một từ đổ bằng dấu cách, các từ thường theo sau hiện tiếp ('xin ' thấy 'chào'); gõ tiếp chữ cái sẽ dựng lại danh sách theo cả chữ đó và từ đứng trước. Từ tiếng Anh vào bằng prefix ASCII thuần, emoji vào qua từ khóa. Bấm 1–5 hoặc click thẳng dòng gợi ý để chọn — từ được chèn kèm dấu cách; lật trang bằng nút ◀▶ trên khung hoặc Ctrl+, / Ctrl+., phím Escape vẫn kết thúc từ như thường, mũi tên giữ nguyên vai trò di chuyển con trỏ. Chạy ở chế độ Preedit và các chế độ có kênh xóa chữ (Surrounding, Forward Backspace, Flow) — một lựa chọn sẽ xóa chữ app đang giữ trước khi commit. Chỉ với preset Telex, Telex 2, Telex W, VIQR — các preset khác dùng số làm phím dấu nên không dùng được. Cần file mô hình dự đoán đã cài; không có mô hình thì chỉ từ khóa emoji mở được dải gợi ý. Kiểu hiển thị đổi bằng hàng 'Kiểu hiển thị gợi ý' ngay dưới. Mặc định tắt, thuộc nhóm tính năng thử nghiệm."
suggest_display = "Chọn chỗ hiện phần đang gõ khi dải gợi ý mở: Ô nổi (mặc định) — chỉ trong khung, ô soạn sạch đến khi từ được commit; Cả hai — từ hiện ở cả khung gợi ý và trong ô soạn, gõ tiếp hay xóa đều cập nhật đồng bộ; Trong ô soạn — preedit nằm trong văn bản như các bộ gõ cũ, dải gợi ý hiện bên cạnh, không có dòng chữ trong khung. Chỉ có tác dụng khi 'Gợi ý từ (n-gram)' đang bật."
suggest_learn = "Học chỉ khi anh CHỌN một gợi ý — không bao giờ ghi phím gõ; mỗi lựa chọn tăng một đơn vị đếm trong hai tệp user-picks.dict và user-picks-pairs.dict (quyền 0600, trong thư mục cấu hình) và dồn lên hàng đợi ghi khi engine nghỉ. Từ đã học được ưu tiên hơn trong đúng nhóm ngôn ngữ của nó, không bao giờ nhảy lên trên tiếng Việt. Ô mật khẩu không học. Nút Xoá dữ liệu đã học bên dưới xoá sạch hai tệp. Mặc định tắt, thuộc nhóm tính năng thử nghiệm."
preferred_backend = "Chọn backend tiêm phím được ưu tiên: uinput là bàn phím ảo của nhân, XTest chỉ có trên X11, wlroots cho Hyprland/sway, libei qua GNOME (đã đo thấy rủi ro crash — chỉ để thử nghiệm). Backend chọn được đặt lên đầu danh sách ưu tiên; không dựng được thì bộ gõ tự rơi về thứ tự theo môi trường. “Tự động (khuyến nghị)” là hành vi mặc định."
abbrev = "Giữ đ nguyên trong từ viết tắt: ddc, ddk, ddt không bị đổi thành đ."
bypass_url = "Liên kết thật (https://, www.) gõ nguyên toàn bộ, kể cả phần ?x=1&#tag;. Không ký tự nào chặn gõ dấu nữa — mọi dấu câu (: = # ? @ . _ /…) đều gõ tiếng Việt bình thường ngay sau nó."
w2u = "Gõ w nhận ư: w = ư, wa = ưa... tiện cho bàn phím không có sẵn ư."
bracket = "Gõ [ và ] nhận ơ và ư theo vị trí trong từ."
em_dash = "Hai dấu gạch ngang liên tiếp (--) thành gạch ngang dài (—)."
auto_capitalize = "Tự viết hoa chữ cái đầu câu sau dấu chấm, !, ? hoặc Enter."
double_space = "Nhấn hai dấu cách liên tiếp thành dấu chấm + khoảng cách (thử nghiệm)."
macro_enabled = "Bật bảng gõ tắt: chuỗi khóa được mở rộng thành nội dung khi gõ xong từ."
capitalize_macro = "Khóa viết hoa (Gs) thì nội dung cũng viết hoa theo."
macro_in_off_mode = "Gõ tắt vẫn hoạt động khi tiếng Việt đang tắt."
emoji_enabled = "Gõ :smile: thành emoji. Từ sau dấu hai chấm vẫn gõ dấu bình thường; khi gõ dấu hai chấm đóng, tên được tra theo phím gốc — khớp thì thành emoji, không khớp thì giữ nguyên văn."
dictionary_enabled = "Bật từ điển cá nhân: các từ trong danh sách không bị trả về chuỗi phím gốc."
debug_log = "Ghi lại quyết định của engine vào ~/.cache/ibus-mangrs/debug.log để báo lỗi."
debug_log_keys = "Ghi từng phím nhấn (keyval/state) vào log — chỉ cần khi gỡ lỗi đường phím (keymap, modifier, hotkey). Mặc định tắt để log không đầy rác; log cũng tự xoay 5 MB một file (bản cũ giữ ở debug.log.old)."
x11_delete = "Cách xoá từ ở app X11 trực tiếp: xoá đuôi từ như ibus-bamboo, hoặc chỉ xoá theo báo cáo của app."
preedit_xim = "Dùng cửa sổ preedit riêng cho app XIM (Java/JetBrains) vốn không hỗ trợ preedit của IBus."
commit_interval = "Nhịp gửi từng chữ ở mode uinput — giảm nếu app bị mất chữ, tăng nếu bị đơ."
backspace_interval = "Nhịp gửi Backspace ở mode uinput — giảm nếu xoá chậm, tăng nếu app xử lý không kịp."
post_delay = "Chờ sau khi viết lại cả từ trước khi gõ chữ tiếp, dành cho app xử lý phím chậm."
export = "Lưu toàn bộ cấu hình, gõ tắt và từ điển ra một file JSON để mang sang máy khác."
import = "Đọc lại file JSON đã xuất: ghi đè cấu hình, gõ tắt và từ điển hiện tại."
desktop_icon = "Ẩn hay hiện dòng “MăngRS Cấu hình” trong lưới ứng dụng của GNOME (cần vài giây để GNOME nhận thay đổi)."
focus_extension = "Extension báo cho engine tên cửa sổ đang focus, để luật theo app chạy được với app Wayland thuần (Chrome, Firefox…)."
extension_logout = "Đăng xuất để extension mới được tải (GNOME giữ module cũ trong bộ nhớ)."
reset_defaults = "Ghi đè config.toml bằng giá trị mặc định (kể cả menu panel, luật theo app, phím tắt). Gõ tắt và từ điển không bị đụng đến."
experimental_features = "Công tắc chính của tab Thử nghiệm: tắt thì mọi hàng dưới bị khóa và bộ gõ chạy theo mặc định; giá trị đã chỉnh vẫn được lưu để dùng lại khi bật lại."
macro_valid_words = "Tính năng Gõ tắt: phím tắt trùng một từ tiếng Việt thật (vd “cam”) không nở để không cản gõ từ thường. Bật thì gõ tắt vẫn thắng — muốn gõ từ thật, Backspace một phím rồi gõ lại phím đó."
extra_url_chars = "Tính năng Không dấu sau URL mặc định chỉ giữ nguyên URL thật (https://, www.). Hàng này thêm ký tự riêng: từ gõ ngay sau ký tự đó sẽ giữ nguyên (không thêm dấu). Bật công tắc trái, liệt kê ký tự vào ô phải (ví dụ: ` ' !); dấu - bị loại để giữ -- thành gạch dài."
auto_capitalize_after = "Tính năng Tự viết hoa (sau . ! ? và Enter): hàng này thêm ký tự riêng vào bộ đó. Bật công tắc trái, liệt kê ký tự vào ô phải (ví dụ : ”); không nhận chữ, số, khoảng trắng."
echo_stale = "Bảo vệ xả commit trên Wayland: chờ các phím Backspace ảo (echo) quay về trước khi đổ chữ đã commit vào app. Số ms bên phải là thời hạn chờ — quá hạn thì xả luôn để chữ không treo.quá hạn thì xả luôn để chữ không treo. 50–1000 ms, quá thấp dễ mất chữ, quá cao làm chữ hiện trễ. Mặc định 150 ms."
idle_commit = "Tính năng Chấp nhận từ khi nghỉ gõ: dừng tay quá lâu trên một từ đang gạch chân thì từ đó được commit luôn, như bấm dấu cách. Số ms bên phải là ngưỡng nghỉ tay.Số ms bên phải là ngưỡng nghỉ tay. 300–2000 ms."
flow_per_key = "Flow hiện chữ có dấu ngay trong lúc gõ (ee → ê) thay vì giữ phím raw đến hết từ — luôn bật, không có công tắc. Gõ rất nhanh các bước được gộp, chữ hiện khi nghỉ tay. Số ms trong ô là trễ đổ chữ có dấu vào văn bản — thấp là dấu hiện sớm hơn, cao là gõ mượt hơn. 0–500 ms, mặc định 20. Quá thấp có thể làm lệch thứ tự chữ trên Wayland."
flow_backspace_retrack = "Sửa dấu sau Backspace ở Flow: xoá một ký tự của từ đã gõ xong rồi gõ phím dấu mới, từ vẫn tiếp tục biến hoá (tùn + s → tún) thay vì rơi thành chữ thường. Luôn bật ở Flow."
flow_backspace_restore = "Hoàn dấu sau Backspace, chuẩn ở Flow: gõ chào rồi gõ thêm f (dấu bị gỡ, màn hình thành chaof), bấm Backspace thì dấu quay lại (chào) — theo đúng cài đặt “Xóa dấu bằng Backspace”: Unikey và Xóa dấu trước trả lại dấu, Cả ký tự thì xoá một ký tự. Số ms trong ô là thời gian chờ sau Backspace rồi mới sửa màn hình (0–1000, mặc định 150)."
nav_key_while_preedit = "Điều hướng khi còn từ: khi từ vẫn còn gạch chân, phím mũi tên đầu tiên mặc định đưa caret chạy ngay (kiểu ibus-bamboo) — commit vẫn nằm trong cùng lượt trả về, tới trước phím mũi tên. Nếu chữ bị chèn sai chỗ ở một app nào, chọn lại “Chỉ ghi từ, con trỏ đứng yên”: lần nhấn đầu chỉ commit từ, lần hai mới di chuyển."
