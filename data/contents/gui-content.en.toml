[tips]
debug_buffer = "The text currently in the test box, read from the box itself rather than from the IME."
debug_log_pause = "Pauses the log the engine writes; nothing is appended until you switch it back on."
debug_hide = "On: the report replaces what was typed with *** and keeps only the macro count. Off: it carries both."
debug_filter = "Type part of a line to filter it, case does not matter."
debug_kind = "Shows one kind of line at a time. Anything else only appears under All."
debug_try = "Typing here shows whether the IME sees your keys: a new line on the left means the key went through IBus."
hotkey_emoji = "Opens the emoji menu at the caret. Assign the combo on the Shortcuts page."
enabled = "Turns the whole IME on or off. Off sends keys straight to the app as if MăngRS were not installed."
method = "The typing method decides how accented letters are built, e.g. Telex types ss for á and VNI types a1 for á."
mode = "How text reaches the app. Underline shows the word in the app and needs preedit support. Surrounding repairs the word tail through the app's own text reports. Flow injects every key, so it needs an injection backend. Forward Backspace works in every app. OFF turns Vietnamese typing off."
charset = "The character table. Unicode covers everyday use, VNI and TCVN3 are only for reading old files."
hide_underline = "Hides the underline in apps that draw it wrong, such as some games and terminals."
dodge_inline_autocomplete = "While a browser shows a suggestion in its address bar, the word keeps its marks instead of coming out garbled. Off by default."
modern = "New tone placement from the Ministry of Education: hòa instead of hoà."
free = "Lets the tone sit anywhere in the word instead of always on the nearest vowel."
auto_correct = "A syllable missing from the dictionary returns the exact keys typed."
auto_restore = "Foreign words such as english or hello return to the raw keys when finished."
extended_finals = "Lets g, k, h, nk stand for ng, c, nh so the tone lands right either way. Off by default."
extended_onsets = "Lets f, j, w start a syllable and take a tone. Off by default so English words stay clean."
keep_composed_words = "A finished word keeps a new letter appended instead of reverting to the raw keys. Off by default."
keep_repeats_raw = "For Flow: on, a held key streams raw like a plain keyboard. Off by default."
suggest_words = "Shows the word being typed with a suggestion strip beside the caret. Pick with the ` key, Alt+1 to Alt+5 or a click on a row. Off by default."
suggest_learn = "Only the suggestions you pick are recorded, never the keys you type. A learned word ranks first inside its own language only."
preferred_backend = "Chooses the preferred way to inject keys. Automatic is the best default, change it only when testing."
abbrev = "Keeps đ in abbreviations: ddc and ddk are not turned into đ."
bypass_url = "Real links such as https:// and www. type raw as a whole, and punctuation after them still types Vietnamese."
w2u = "Typing w gives ư: w is ư, wa is ưa. Handy on keyboards without a ư key."
bracket = "Typing [ and ] gives ơ and ư depending on the place in the word."
em_dash = "Two hyphens in a row become one em dash."
auto_capitalize = "Capitalizes the first letter after a period, exclamation mark, question mark or Enter."
double_space = "Two spaces in a row become a period and a space."
macro_enabled = "Turns the shorthand table on: a key string expands when the word ends."
capitalize_macro = "An uppercase key makes the expansion uppercase too."
macro_in_off_mode = "Shorthand keeps working while Vietnamese typing is off."
emoji_enabled = "Typing :smile: gives an emoji. A name that does not match stays as typed."
dictionary_enabled = "Words in my dictionary are never reverted to raw keys."
debug_log = "The engine writes its decisions to ~/.cache/ibus-mangrs/debug.log. Turning it on asks whether to log the text and every key. The log rotates at 5 MB."
x11_delete = "How words are deleted in direct X11 apps: erase the word tail like ibus-bamboo, or only as the app reports."
preedit_xim = "Uses a separate underline window for XIM apps such as Java and JetBrains, which ignore IBus preedit."
backspace_interval = "The Backspace pace. Lower it if deletion lags, raise it if the app cannot keep up."
post_delay = "A small wait after rewriting a whole word, for apps with slow key handling."
export = "Saves the configuration, shorthand and dictionary to one JSON file for another machine."
import = "Reads an exported JSON file and overwrites the configuration, shorthand and dictionary."
desktop_icon = "Shows or hides the MăngRS entry in the GNOME app grid. GNOME takes a few seconds to notice."
focus_extension = "The extension reports the focused window to the engine, so per-app rules work with native Wayland apps such as Chrome and Firefox."
extension_logout = "Log out and back in so GNOME loads the new extension."
reset_defaults = "Overwrites config.toml with the defaults, including the panel menu, per-app rules and shortcuts. Shorthand and the dictionary stay."
experimental_features = "The master switch of the Experimental tab. Off locks every row below and typing runs on defaults, your values stay saved."
macro_valid_words = "A shortcut matching a real Vietnamese word, such as cam, does not expand, so normal typing is never blocked. On, shorthand wins; to type the word, press Backspace once and retype the key."
echo_stale = "Waits for the virtual Backspace keys to come back before the committed text lands, so nothing is lost on Wayland. The number is the wait limit, default 150."
idle_commit = "Pausing on an underlined word commits it, as if Space was pressed. The number is the pause threshold."
flow_per_key = "Flow shows the accented letter while you type. The number is the delay before the text lands, lower shows marks sooner."
flow_backspace_retrack = "Erase one letter of a finished word and type a new mark: the word keeps changing instead of falling back to plain letters."
flow_backspace_restore = "A new mark key removes the tone, Backspace brings it back. The number is the wait before the screen is rewritten, default 150."
nav_key_while_preedit = "With a word still underlined, the first arrow key moves the caret right away, like ibus-bamboo. If text lands in the wrong place, choose Swallow so the first press only commits the word."
hotkey_app_rule = "Opens the mode picker right at the caret. Assign the combo on the Shortcuts page."
show_toasts = "Small bubbles on add, delete, export, import or extension install. Off stays silent, errors still show a dialog."
learn_clear = "Only the suggestions you pick are recorded, never the keys you type. Erasing makes the engine learn from zero."
backspace_tone = "Tone first: hạ becomes ha, then h. Whole char: hạ becomes h, one character per press. Unikey: walks back through the keys as typed."

