# English GUI content for MăngRS: the mirror of gui-content.toml. Edit this
# file and rebuild - no code changes needed. The key-parity test in
# src/gui/text.rs forbids missing keys, so a key added to the Vietnamese
# file without an entry here fails cargo test.
#
# Notes:
# - Placeholders ({n}, {page}, {e}, {f}, {app}), markup tags (<tt>, &amp;)
#   and URLs/file paths stay verbatim.
# - Row titles and subtitles render as plain text; group titles and
#   descriptions are Pango markup: escape & as &amp;.
# - Proper nouns (MăngRS, Telex, VNI, TCVN3, Flow, Turbo, bamboo-core) keep
#   their spelling; the mode/charset/method item lists live in the code.

