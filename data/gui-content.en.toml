[tips]
enabled = "Toggles the whole input method. When off, every key goes straight into the app as if MăngRS were not installed."
method = "The typing method decides how accented text is built from the keys: Telex (ss → á), VNI (a1 → á) or VIQR."
mode = "How the in-flight text is displayed: preedit (underlined) works in every app; the uinput modes send real keys but can drift per app."
charset = "The character table: Unicode for every normal use; the VNI/TCVN3 tables are only needed when reading old text files."
hide_underline = "Hides the preedit underline for apps that draw it broken (some games, terminals)."
modern = "The Ministry of Education's new tone standard: hòa instead of hoà, thuế instead of thuể."
free = "Allows the tone to sit anywhere in the word instead of always on the nearest vowel."
auto_correct = "Syllables missing from the Vietnamese syllable table return the exact keys typed."
auto_restore = "Foreign words (english, hello) return to the raw key string once typed instead of staying."
abbrev = "Keeps đ intact in abbreviations: ddc, ddk, ddt are not turned into đ."
bypass_url = "Real links (https://, www.) type raw across the whole address, including the ?x=1&#tag part; a word right after @ . _ / also stays raw (email, path, snake_case). Prose punctuation : = # ? & % ~ no longer blocks tones."
w2u = "Typing w gives ư: w = ư, wa = ưa… handy on keyboards without a ư key."
bracket = "Typing [ and ] gives ơ and ư depending on the position in the word."
em_dash = "Two hyphens in a row (--) become an em dash (—)."
auto_capitalize = "Auto-capitalizes the first letter of a sentence after a period, !, ? or Enter."
double_space = "Two consecutive spaces become a period + space (experimental)."
macro_enabled = "Enables the shorthand table: a key string expands into its content at word end."
capitalize_macro = "An uppercase key (Gs) capitalizes the expansion too."
macro_in_off_mode = "Shorthand keeps working while Vietnamese typing is off."
emoji_enabled = "Typing :smile: becomes an emoji. A word glued right after the colon gets no tones while this is on (like the URL bypass); turn it off if you often type :word_style."
dictionary_enabled = "Enables my dictionary: words in the list are never restored to raw keys."
debug_log = "Logs the engine's decisions to ~/.cache/ibus-mangrs/debug.log for bug reports."
x11_delete = "How words are deleted on direct X11 apps: delete the word tail like ibus-bamboo, or delete only as reported by the app."
preedit_xim = "Uses a separate preedit window for XIM apps (Java/JetBrains) that lack IBus preedit support."
commit_interval = "The per-word send pace in uinput modes — lower it if an app loses text, raise it if it stalls."
backspace_interval = "The Backspace send pace in uinput modes — lower it if deletion lags, raise it if the app cannot keep up."
post_delay = "Waits after rewriting a whole word before the next character, for apps with slow key handling."
unicode_channel = "How words with special characters are sent: CommitText is safe; Clipboard uses Ctrl+V and temporarily overwrites the clipboard."
export = "Saves the whole configuration, shorthand and dictionary to one JSON file to carry to another machine."
import = "Reads back an exported JSON file: overwrites the current configuration, shorthand and dictionary."
desktop_icon = "Show or hide the “MăngRS Settings” entry in GNOME's app grid (GNOME takes a few seconds to notice)."
focus_extension = "The extension tells the engine the focused window's name, so per-app rules work with native Wayland apps (Chrome, Firefox…)."
extension_logout = "Log out so the new extension is loaded (GNOME keeps the old module in memory)."
reset_defaults = "Overwrites config.toml with the defaults (including the panel menu, per-app rules, shortcuts). Shorthand and the dictionary are untouched."
experimental_features = "The master switch of the Experimental tab: off locks every row below and typing behaves with the defaults; adjusted values stay saved for when it returns."
macro_valid_words = "The Shorthand feature: a shortcut colliding with a real Vietnamese word (e.g. \"cam\") does not expand, so normal typing is never blocked. On, shorthand wins — to type the real word, Backspace once and retype that key."
extra_url_chars = "The No-tone-after-URL feature (by default it applies to / @ . _): this row adds custom characters to that set. Flip the left switch and list the characters in the right box (e.g. ` ' !); '-' is rejected so -- stays an em dash."
auto_capitalize_after = "The Auto-capitalize feature (after . ! ? and Enter): this row adds custom characters to that set. Flip the left switch and list the characters in the right box (e.g. : ”); no letters, digits or spaces."
clipboard_restore = "The clipboard-restore feature: pasting marked text over the Clipboard channel overwrites the clipboard for a moment — the right number is how long before the old clipboard comes back. Only effective when the send channel is Clipboard.Only effective when the send channel is Clipboard. 100–5000 ms, default 600."
echo_stale = "The commit-flush guard on Wayland: the engine waits for the virtual Backspace keys (echoes) to return before the committed text lands in the app. The right number is the wait limit — past it the text flushes anyway instead of hanging.past it the text flushes anyway instead of hanging. 50–1000 ms, too low risks losing text, too high delays it. Default 150 ms."
idle_commit = "The commit-on-pause feature: pausing long enough on an underlined word commits it, as if Space was pressed. The right number is the pause threshold.The right number is the pause threshold. 300–2000 ms."
flow_per_key_delay = "The per-key marks feature in Flow (its switch lives on the Tuning tab): the right number is the delay before marked text lands in the document — lower shows marks sooner, higher types smoother. 0–500 ms, default 60.0–500 ms, default 60. A too-low value can reorder text on Wayland."
flow_backspace_retrack = "The mark-editing-after-Backspace feature in Flow/Turbo: erase one character of a finished word and type a mark key — the word keeps transforming (tùn + s → tún) instead of falling back to plain letters. Needs per-key marks on."
nav_key_while_preedit = "The nav-key-while-a-word-is-typed feature: with a word still underlined, the first arrow key swallows to commit first (default, press twice to move) or moves the caret right away. If text lands in the wrong place, go back to Swallow."
