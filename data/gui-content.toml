# GUI content for MăngRS: every user-visible text the settings window shows.
# Edit this file and rebuild - no code changes needed. A missing or mistyped
# key falls back to the default baked into the code, so a typo can never
# blank out the interface.
#
# Notes:
# - The logo image is data/logo.png (embedded at build time; replace the
#   file to change it).
# - Icon names, the mode/charset/method lists and the menu design defaults
#   are functional data, not content: they stay in the code.

[app]
name = "MăngRS"

[pages]
